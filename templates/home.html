{% extends 'base.html' %}

{% block content %}
<div class="container">

    <h2>Welcome to Calorie Counter</h2>

    <p>
        Calculate your daily BMR and track the calories
        you consume every day.
    </p>

    {% if user.is_authenticated %}
        <a href="{% url 'dashboard' %}">Go to Dashboard</a>
    {% else %}
        <a href="{% url 'register' %}">Get Started</a>
        <a href="{% url 'login' %}">Login</a>
    {% endif %}

</div>
{% endblock %}
